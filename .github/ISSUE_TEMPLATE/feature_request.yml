name: ✨ Feature Request
description: Suggest a new lesson, task, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please fill out the form below.

  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
      description: What problem does this feature solve, or what gap in the course does it fill?
      placeholder: "I noticed the course doesn't cover..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area does this relate to?
      options:
        - Module 0 — Start Here
        - Module 1 — Architecture
        - Module 2 — Workloads
        - Module 3 — Networking
        - Module 4 — Storage
        - Module 5 — Troubleshooting
        - Module 6 — Exam Prep
        - Lab scripts
        - Cheatsheet
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or improvement you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.
