kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cka
networking:
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"   # must not overlap Docker Desktop's 192.168.65.0/24
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
